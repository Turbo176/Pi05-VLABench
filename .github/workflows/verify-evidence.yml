name: Verify experiment evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hashes and recompute paired results
        run: python3 scripts/review_fruit_experiment.py
      - name: Recompute the forty-scene fruit comparison
        working-directory: docs/experiments/2026-11-24/fruit-recovery-v2
        run: >-
          python3 analyze.py --verify-only
          --cases evidence/test-cases.jsonl
          --base evidence/test-reference.jsonl
          --sft evidence/test-sft.jsonl
          --ppo evidence/test-ppo.jsonl
          --selection evidence/final-selection.json
          --output results
      - name: Verify full-action SFT and PPO comparison
        working-directory: docs/experiments/2026-11-24/fruit-full-action-v3
        run: python3 analyze.py --evidence evidence --output results --verify-only
